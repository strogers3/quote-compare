<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quotes">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Quote Compare</title>
<style>
:root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--acc:#0f766e;--onacc:#fff;--accbg:#ccfbf1;--red:#b91c1c;--star:#f59e0b;--off:#d6d3d1}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--card:#1c1917;--ink:#f5f5f4;--mute:#a8a29e;--line:#292524;--acc:#2dd4bf;--onacc:#042f2e;--accbg:#134e4a;--red:#f87171;--off:#44403c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:5.5rem 1fr 5.5rem;align-items:center;padding:calc(env(safe-area-inset-top) + .6rem) .9rem .6rem;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a{color:var(--acc);text-decoration:none}
#act{text-align:right}
main{padding:1rem 1rem calc(env(safe-area-inset-bottom) + 2rem);max-width:760px;margin:0 auto}
input,textarea{width:100%;font:inherit;font-size:16px;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical}
button,.btnlike{display:inline-block;font:inherit;font-weight:600;padding:.6rem 1rem;border-radius:10px;border:0;background:var(--acc);color:var(--onacc);cursor:pointer}
button.ghost,.btnlike{background:none;color:var(--acc);border:1px solid var(--line)}
button.red{color:var(--red)}
button.wide{width:100%;margin-bottom:.6rem}
button.sm{padding:.35rem .7rem;font-size:.85rem}
.mt{margin-top:.5rem}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.row{display:flex;gap:.5rem;margin-bottom:1rem}
.list{list-style:none;padding:0;margin:0 0 1rem;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.list li+li{border-top:1px solid var(--line)}
.list a{display:block;padding:.8rem 1rem;color:inherit;text-decoration:none}
.list small{display:block;color:var(--mute);margin-top:.15rem}
.empty{color:var(--mute);text-align:center;padding:1rem}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
section h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 .75rem}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:.75rem}
label input,label textarea{margin-top:.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .75rem}
.rate{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0}
.stars button{background:none;color:var(--off);font-size:1.7rem;padding:0 .12rem;line-height:1}
.stars button.on{color:var(--star)}
.note{border-top:1px solid var(--line);padding:.6rem 0;display:flex;gap:.5rem}
.note div{flex:1}
.note time{display:block;font-size:.75rem;color:var(--mute)}
.note p{margin:.2rem 0 0;white-space:pre-wrap}
.note button{background:none;color:var(--mute);padding:0 .3rem;font-size:1.2rem;align-self:flex-start}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.6rem}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.final{background:var(--accbg);border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
.hint{font-size:.85rem;color:var(--mute);margin:.25rem 0 .6rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;min-width:100%}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem;white-space:pre-wrap}
td{min-width:9rem}
tbody th,thead th:first-child{position:sticky;left:0;background:var(--card);color:var(--mute);font-weight:500;min-width:6rem}
thead a{color:var(--acc);text-decoration:none}
td.best{background:var(--accbg);font-weight:600}
#viewer{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9}
#viewer img{max-width:100%;max-height:100%}
#viewer .vbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 1rem);display:flex;justify-content:center;gap:1rem}
#viewer .vbar button{background:var(--card)}
</style>
</head>
<body>
<header><span id="back"></span><h1 id="title">Quote Compare</h1><span id="act"></span></header>
<main id="app"></main>
<script>
'use strict';
const CRIT = [['quality','Quality'],['value','Price / value'],['service','Service'],['warranty','Warranty'],['trust','Trust']];
const app = document.getElementById('app');
let db;

// ---------- storage (IndexedDB: survives offline, holds photos) ----------
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('quotecompare',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});
    d.createObjectStore('vendors',{keyPath:'id'}).createIndex('projectId','projectId');
    d.createObjectStore('photos',{keyPath:'id'}).createIndex('vendorId','vendorId');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);let out;
  const req=fn(t.objectStore(store));if(req)req.onsuccess=()=>{out=req.result};
  t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);});}
const get=(s,id)=>tx(s,'readonly',st=>st.get(id));
const put=(s,o)=>tx(s,'readwrite',st=>st.put(o));
const del=(s,id)=>tx(s,'readwrite',st=>st.delete(id));
const all=s=>tx(s,'readonly',st=>st.getAll());
const byIdx=(s,i,v)=>tx(s,'readonly',st=>st.index(i).getAll(v));

let pending=null,saveT;
function saveSoon(s,o){pending=[s,o];clearTimeout(saveT);saveT=setTimeout(flush,400);}
async function flush(){clearTimeout(saveT);if(pending){const [s,o]=pending;pending=null;await put(s,o);}}

// ---------- helpers ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null||n===''?'—':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
function score(v){const r=CRIT.map(([k])=>v.ratings[k]).filter(x=>x>0);return r.length?r.reduce((a,b)=>a+b,0)/r.length:null;}
function scoreText(v){const s=score(v);const n=CRIT.filter(([k])=>v.ratings[k]>0).length;
  return s?`Overall ★ ${s.toFixed(1)} (average of ${n} rating${n==1?'':'s'})`:'Tap the stars to rate. Tap the same star again to clear.';}
function setBar(title,backHash,act=''){document.getElementById('title').textContent=title;
  document.getElementById('back').innerHTML=backHash?`<a href="${backHash}">‹ Back</a>`:'';
  document.getElementById('act').innerHTML=act;document.title=title;window.scrollTo(0,0);}
function bindFields(obj,store){app.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{
  obj[el.dataset.f]=el.type==='number'?(el.value===''?null:Number(el.value)):el.value;saveSoon(store,obj);}));}
function shrink(file,max=1600){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),'image/jpeg',.82);};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file);};img.src=url;});}
async function deleteVendor(v){for(const p of await byIdx('photos','vendorId',v.id))await del('photos',p.id);await del('vendors',v.id);
  const p=await get('projects',v.projectId);if(p&&p.finalVendorId===v.id){p.finalVendorId=null;await put('projects',p);}}

// ---------- router ----------
async function route(){await flush();const parts=(location.hash.slice(1)||'/').split('/').filter(Boolean);
  if(parts[0]==='p'&&parts[2]==='compare')return compare(parts[1]);
  if(parts[0]==='p')return project(parts[1]);
  if(parts[0]==='v')return vendor(parts[1]);
  if(parts[0]==='backup')return backup();
  return home();}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});

// ---------- screens ----------
async function home(){
  setBar('Quote Compare',null,'<a href="#/backup">Backup</a>');
  const ps=(await all('projects')).sort((a,b)=>b.created-a.created);const vs=await all('vendors');
  app.innerHTML=`<form id="np" class="row"><input placeholder="New project, e.g. Kitchen countertops" required><button>Add</button></form>
  ${ps.length?'':'<p class="empty">No projects yet. Make one project per thing you are shopping for, then add each business that quotes on it.</p>'}
  <ul class="list">${ps.map(p=>{const n=vs.filter(v=>v.projectId===p.id).length;const f=vs.find(v=>v.id===p.finalVendorId);
    return `<li><a href="#/p/${p.id}"><b>${esc(p.name)}</b><small>${n} quote${n==1?'':'s'}${f?' · ✓ '+esc(f.name):''}</small></a></li>`;}).join('')}</ul>`;
  if(!ps.length)app.querySelector('.list').remove();
  app.querySelector('#np').onsubmit=async e=>{e.preventDefault();const name=e.target.querySelector('input').value.trim();if(!name)return;
    const p={id:uid(),name,notes:'',finalVendorId:null,created:Date.now()};await put('projects',p);location.hash='#/p/'+p.id;};
}

async function project(id){
  const p=await get('projects',id);if(!p){location.hash='#/';return;}
  const vs=(await byIdx('vendors','projectId',id)).sort((a,b)=>a.created-b.created);
  setBar(p.name,'#/',vs.length>1?`<a href="#/p/${id}/compare">Compare</a>`:'');
  const fin=vs.find(v=>v.id===p.finalVendorId);
  app.innerHTML=`${fin?`<div class="final">✓ Final choice: <b>${esc(fin.name)}</b> · ${money(fin.price)}</div>`:''}
  <form id="nv" class="row"><input placeholder="Business name" required><button>Add</button></form>
  ${vs.length?`<ul class="list">${vs.map(v=>{const s=score(v);return `<li><a href="#/v/${v.id}"><b>${v.id===p.finalVendorId?'✓ ':''}${esc(v.name)}</b>
    <small>${money(v.price)} · ${s?'★ '+s.toFixed(1):'not rated'} · ${v.notes.length} note${v.notes.length==1?'':'s'}</small></a></li>`;}).join('')}</ul>`
    :'<p class="empty">Add each business you get a quote from.</p>'}
  ${vs.length>1?`<a class="btnlike" href="#/p/${id}/compare">Compare side by side</a><p></p>`:''}
  <section><label>Project notes<textarea data-f="notes" rows="3" placeholder="What you need, measurements, budget…">${esc(p.notes)}</textarea></label></section>
  <button id="ren" class="ghost wide">Rename project</button><button id="delp" class="ghost red wide">Delete project</button>`;
  bindFields(p,'projects');
  app.querySelector('#nv').onsubmit=async e=>{e.preventDefault();const name=e.target.querySelector('input').value.trim();if(!name)return;
    const v={id:uid(),projectId:id,name,contact:'',phone:'',email:'',address:'',visitDate:today(),price:null,leadTime:'',warrantyText:'',
      included:'',ratings:{},notes:[],pros:'',cons:'',created:Date.now()};await put('vendors',v);location.hash='#/v/'+v.id;};
  app.querySelector('#ren').onclick=async()=>{const n=prompt('Project name',p.name);if(n&&n.trim()){p.name=n.trim();await flush();await put('projects',p);project(id);}};
  app.querySelector('#delp').onclick=async()=>{if(!confirm(`Delete "${p.name}" and all ${vs.length} quotes, notes and photos?`))return;
    pending=null;for(const v of vs)await deleteVendor(v);await del('projects',id);location.hash='#/';};
}

async function vendor(id){
  const v=await get('vendors',id);if(!v){location.hash='#/';return;}
  const p=await get('projects',v.projectId);
  setBar(v.name||'Quote','#/p/'+v.projectId);
  const f=(k,l,t='text',x='')=>`<label>${l}<input data-f="${k}" type="${t}" value="${esc(v[k]??'')}" ${x}></label>`;
  const ta=(k,l,ph='')=>`<label>${l}<textarea data-f="${k}" rows="3" placeholder="${ph}">${esc(v[k])}</textarea></label>`;
  app.innerHTML=`
  <section><h2>Business</h2>${f('name','Name')}
    <div class="grid2">${f('contact','Contact person')}${f('phone','Phone','tel')}</div>
    ${f('email','Email','email')}${f('address','Address')}${f('visitDate','Visit date','date')}</section>
  <section><h2>Quote</h2>
    <div class="grid2">${f('price','Total price $','number','inputmode="decimal" step="0.01"')}${f('leadTime','Lead time')}</div>
    ${f('warrantyText','Warranty terms')}${ta('included',"What's included",'Materials, install, delivery, taxes…')}</section>
  <section><h2>Notes</h2>
    <textarea id="nt" rows="4" placeholder="Tap the 🎤 on the keyboard to dictate…"></textarea>
    <button id="addn" class="mt">Add note</button><div id="notes" class="mt"></div></section>
  <section><h2>Photos</h2><label class="btnlike">📷 Add photos<input id="ph" type="file" accept="image/*" multiple class="vh"></label>
    <div class="photos" id="phs"></div></section>
  <section><h2>Ratings</h2>${CRIT.map(([k,l])=>`<div class="rate"><span>${l}</span><span class="stars" data-k="${k}">${
    [1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${(v.ratings[k]||0)>=n?'on':''}" aria-label="${n} star">★</button>`).join('')}</span></div>`).join('')}
    <p class="hint" id="sc">${scoreText(v)}</p></section>
  <section><h2>Pros &amp; cons</h2>${ta('pros','Pros')}${ta('cons','Cons')}</section>
  <button id="fin" class="${p.finalVendorId===v.id?'ghost ':''}wide">${p.finalVendorId===v.id?'Remove as final choice':'✓ Choose as final'}</button>
  <button id="delv" class="ghost red wide">Delete this quote</button>`;
  bindFields(v,'vendors');
  app.querySelector('[data-f=name]').addEventListener('input',e=>{document.getElementById('title').textContent=e.target.value||'Quote';});

  app.querySelectorAll('.stars').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    const k=s.dataset.k,n=+b.dataset.n;v.ratings[k]=v.ratings[k]===n?0:n;
    s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=v.ratings[k]));
    app.querySelector('#sc').textContent=scoreText(v);saveSoon('vendors',v);});

  const notesEl=app.querySelector('#notes'),nt=app.querySelector('#nt');
  const renderNotes=()=>{notesEl.innerHTML=v.notes.map(n=>`<div class="note"><div><time>${new Date(n.ts).toLocaleString()}</time><p>${esc(n.text)}</p></div>
    <button data-del="${n.id}" aria-label="Delete note">×</button></div>`).join('');};
  renderNotes();
  app.querySelector('#addn').onclick=async()=>{const t=nt.value.trim();if(!t)return;v.notes.unshift({id:uid(),ts:Date.now(),text:t});
    nt.value='';pending=null;await put('vendors',v);renderNotes();};
  notesEl.onclick=async e=>{const d=e.target.dataset.del;if(!d||!confirm('Delete this note?'))return;
    v.notes=v.notes.filter(n=>n.id!==d);pending=null;await put('vendors',v);renderNotes();};

  const phs=app.querySelector('#phs'),ph=app.querySelector('#ph');let urls=[];
  const loadPhotos=async()=>{urls.forEach(URL.revokeObjectURL);urls=[];phs.innerHTML='';
    (await byIdx('photos','vendorId',id)).sort((a,b)=>a.ts-b.ts).forEach(x=>{const img=document.createElement('img');
      img.src=URL.createObjectURL(x.blob);urls.push(img.src);img.onclick=()=>viewPhoto(x,loadPhotos);phs.append(img);});};
  loadPhotos();
  ph.onchange=async()=>{for(const file of ph.files)await put('photos',{id:uid(),vendorId:id,blob:await shrink(file),ts:Date.now()});ph.value='';loadPhotos();};

  app.querySelector('#fin').onclick=async()=>{const pr=await get('projects',v.projectId);pr.finalVendorId=pr.finalVendorId===v.id?null:v.id;
    await put('projects',pr);vendor(id);};
  app.querySelector('#delv').onclick=async()=>{if(!confirm(`Delete the quote from "${v.name}" with its notes and photos?`))return;
    pending=null;await deleteVendor(v);location.hash='#/p/'+v.projectId;};
}

function viewPhoto(x,after){const d=document.createElement('div');d.id='viewer';const u=URL.createObjectURL(x.blob);
  d.innerHTML=`<img src="${u}" alt=""><div class="vbar"><button class="ghost" data-a="x">Close</button><button class="ghost red" data-a="d">Delete</button></div>`;
  d.onclick=async e=>{const a=e.target.dataset.a;if(!a)return;if(a==='d'){if(!confirm('Delete this photo?'))return;await del('photos',x.id);}
    d.remove();URL.revokeObjectURL(u);if(a==='d')after();};
  document.body.append(d);}

async function compare(id){
  const p=await get('projects',id);if(!p){location.hash='#/';return;}
  const vs=(await byIdx('vendors','projectId',id)).sort((a,b)=>a.created-b.created);
  setBar('Compare','#/p/'+id);
  if(!vs.length){app.innerHTML='<p class="empty">No quotes yet.</p>';return;}
  const prices=vs.map(v=>v.price).filter(x=>x!=null);const minP=prices.length>1?Math.min(...prices):null;
  const scores=vs.map(score);const rated=scores.filter(x=>x!=null);const maxS=rated.length>1?Math.max(...rated):null;
  const row=(l,fn,best)=>`<tr><th>${l}</th>${vs.map((v,i)=>`<td class="${best&&best(v,i)?'best':''}">${fn(v,i)}</td>`).join('')}</tr>`;
  const txt=k=>v=>esc(v[k])||'—';
  app.innerHTML=`<p class="hint">Highlighted = lowest price / highest overall rating. Scroll sideways for more businesses.</p>
  <div class="tablewrap"><table><thead><tr><th></th>${vs.map(v=>`<th><a href="#/v/${v.id}">${v.id===p.finalVendorId?'✓ ':''}${esc(v.name)}</a></th>`).join('')}</tr></thead><tbody>
  ${row('Price',v=>money(v.price),v=>minP!=null&&v.price===minP)}
  ${row('Overall',(v,i)=>scores[i]?'★ '+scores[i].toFixed(1):'—',(v,i)=>maxS!=null&&scores[i]===maxS)}
  ${CRIT.map(([k,l])=>row(l,v=>v.ratings[k]?'★'.repeat(v.ratings[k]):'—')).join('')}
  ${row('Lead time',txt('leadTime'))}${row('Warranty terms',txt('warrantyText'))}${row('Included',txt('included'))}
  ${row('Pros',txt('pros'))}${row('Cons',txt('cons'))}
  ${row('Notes',v=>v.notes.length?v.notes.map(n=>'• '+esc(n.text)).join('\n'):'—')}
  ${row('',v=>`<button data-pick="${v.id}" class="sm${v.id===p.finalVendorId?'':' ghost'}">${v.id===p.finalVendorId?'✓ Final':'Choose'}</button>`)}
  </tbody></table></div>`;
  app.onclick=null;
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{p.finalVendorId=p.finalVendorId===b.dataset.pick?null:b.dataset.pick;await put('projects',p);compare(id);});
}

async function backup(){
  setBar('Backup','#/');
  app.innerHTML=`<section><h2>Export</h2><p class="hint">Everything lives only on this iPhone. Export a backup now and then and save it to Files / iCloud Drive.</p>
    <button id="prep">Prepare backup</button> <button id="save" class="ghost" hidden>Save backup file</button><p id="exm" class="hint"></p></section>
  <section><h2>Review &amp; report</h2><p class="hint">On a computer or iPad, open the review page, load this backup file, then set weights, record your decision and print a PDF report for your group.</p>
    <a class="btnlike" href="review.html">Open review page</a></section>
  <section><h2>Restore</h2><p class="hint">Merges a backup file into this device (items with the same ID are overwritten).</p>
    <label class="btnlike">Choose backup file<input id="im" type="file" accept="application/json,.json" class="vh"></label><p id="msg" class="hint"></p></section>
  <section><h2>Storage</h2><p class="hint" id="st">…</p></section>`;
  const toData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
  let file;const save=app.querySelector('#save');
  app.querySelector('#prep').onclick=async()=>{await flush();
    const data={app:'quotecompare',version:1,exported:new Date().toISOString(),projects:await all('projects'),vendors:await all('vendors'),
      photos:await Promise.all((await all('photos')).map(async x=>({...x,blob:await toData(x.blob)})))};
    const name=`quotes-backup-${today()}.json`;file=new File([JSON.stringify(data)],name,{type:'application/json'});
    app.querySelector('#exm').textContent=`${data.projects.length} projects, ${data.vendors.length} quotes, ${data.photos.length} photos · ${(file.size/1048576).toFixed(1)} MB`;
    save.hidden=false;};
  save.onclick=()=>{if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();}};
  const im=app.querySelector('#im'),msg=app.querySelector('#msg');
  im.onchange=async()=>{const fl=im.files[0];if(!fl)return;try{const d=JSON.parse(await fl.text());
      if(d.app!=='quotecompare')throw new Error('not a Quote Compare backup');
      for(const x of d.projects)await put('projects',x);for(const x of d.vendors)await put('vendors',x);
      for(const x of d.photos)await put('photos',{...x,blob:await (await fetch(x.blob)).blob()});
      msg.textContent=`Restored ${d.projects.length} projects, ${d.vendors.length} quotes, ${d.photos.length} photos.`;}
    catch(e){msg.textContent='Restore failed: '+e.message;}im.value='';};
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    const kept=navigator.storage.persisted?await navigator.storage.persisted():false;
    app.querySelector('#st').textContent=`Using ${(e.usage/1048576).toFixed(1)} MB.${kept?' Storage is marked persistent.':''}`;}
  else app.querySelector('#st').textContent='Storage info not available.';
}

// ---------- start ----------
(async()=>{db=await openDB();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  route();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})();
</script>
